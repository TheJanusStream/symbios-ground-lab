[package]
name = "symbios-ground-lab"
version = "0.2.0"
edition = "2024"

[dependencies]
bevy = "0.18"
bevy_egui = "0.39"
bevy_panorbit_camera = { version = "0.34", features = ["bevy_egui"] }
symbios-ground = "0.1"
bevy_symbios_ground = "0.1"
bevy_symbios_texture = "0.2"
rand = "0.9"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
rand_pcg = "0.9"
image = "0.25"
bytemuck = "1"

[dev-dependencies]

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
getrandom = { version = "0.2", features = ["js"] }
web-sys = { version = "0.3.82", features = [
    "Document",
    "Window",
    "HtmlElement",
    "HtmlAnchorElement",
    "HtmlBodyElement",
    "Node",
    "Blob",
    "Url",
    "BlobPropertyBag",
    "Clipboard",
    "ClipboardEvent",
    "Navigator",
] }
wasm-bindgen = "0.2.108"
js-sys = "0.3.82"

[profile.release]
opt-level = "s"   # Optimize for size (helps wasm-bindgen)
lto = "fat"       # Enable full Link Time Optimization (CRITICAL FIX)
codegen-units = 1 # Reduce parallelism to improve optimization quality
strip = true      # Strip symbols to clean up the binary tables
panic = "abort"   # Reduce binary size by removing stack unwinding
